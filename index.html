<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#080d1c" />
  
  <!-- Meta tags para modo Aplicativo (PWA) no Android e iOS -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Agnus IA" />
  
  <!-- Ícone PWA embutido (SVG Data URI) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2365b8ff'/%3E%3Cstop offset='65%25' stop-color='%233868ed'/%3E%3Cstop offset='100%25' stop-color='%23704dff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='120' fill='url(%23g)'/%3E%3Cpath d='M256 96l44 132 132 44-132 44-44 132-44-132-132-44 132-44z' fill='none' stroke='white' stroke-width='28' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2365b8ff'/%3E%3Cstop offset='65%25' stop-color='%233868ed'/%3E%3Cstop offset='100%25' stop-color='%23704dff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='120' fill='url(%23g)'/%3E%3Cpath d='M256 96l44 132 132 44-132 44-44 132-44-132-132-44 132-44z' fill='none' stroke='white' stroke-width='28' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <!-- Manifest PWA embutido -->
  <link rel="manifest" id="pwa-manifest" />

  <title>Agnus IA — Seu espaço inteligente</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080d1c;
      --panel: rgba(16, 25, 48, .82);
      --panel-2: #111b33;
      --line: rgba(148, 163, 184, .16);
      --text: #edf4ff;
      --muted: #91a2c2;
      --blue: #4f8cff;
      --cyan: #5de0ff;
      --blue-2: #2868e8;
      --user: linear-gradient(135deg, #2868e8, #4c8dff);
      --shadow: 0 24px 80px rgba(0, 0, 0, .35);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 15% -10%, rgba(45, 105, 230, .24), transparent 60%),
        radial-gradient(700px 500px at 100% 20%, rgba(36, 190, 230, .13), transparent 60%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .topbar {
      min-height: 76px;
      padding: 14px clamp(14px, 4vw, 42px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 13, 28, .72);
      backdrop-filter: blur(18px);
      position: relative;
      z-index: 2;
      flex-shrink: 0;
    }

    .brand { display: flex; align-items: center; gap: 12px; min-width: max-content; }
    .brand-mark {
      width: 42px; height: 42px; display: grid; place-items: center;
      border-radius: 14px;
      color: white;
      background: linear-gradient(145deg, #65b8ff, #3868ed 65%, #704dff);
      box-shadow: 0 8px 28px rgba(57, 119, 255, .35);
    }
    .brand-mark svg { width: 23px; height: 23px; }
    .brand-name { font-size: 16px; font-weight: 750; letter-spacing: -.3px; }
    .brand-sub { color: var(--muted); font-size: 11px; margin-top: 2px; }

    .connection {
      display: flex; align-items: center; justify-content: flex-end;
      gap: 9px; flex: 1; max-width: 760px;
    }
    .field {
      height: 42px; min-width: 0; color: var(--text);
      background: rgba(17, 27, 51, .88);
      border: 1px solid var(--line); border-radius: 12px;
      outline: none; padding: 0 13px; transition: .2s ease;
    }
    .field:focus, .composer:focus-within {
      border-color: rgba(93, 160, 255, .75);
      box-shadow: 0 0 0 3px rgba(63, 130, 255, .12);
    }
    #apiUrl { flex: 1; min-width: 120px; font-size: 12px; color: #b9c9e8; }
    #modelName { width: 130px; font-size: 12px; }

    /* Botão opcional de instalar PWA */
    #installBtn {
      display: none;
      height: 42px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid rgba(93, 224, 255, 0.4);
      background: rgba(40, 104, 232, 0.25);
      color: #8ce4ff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: .2s ease;
    }
    #installBtn:hover { background: rgba(40, 104, 232, 0.45); }

    .main { flex: 1; min-height: 0; display: flex; justify-content: center; overflow: hidden; }
    .chat-shell {
      width: min(100%, 940px); height: 100%; min-height: 0; display: flex; flex-direction: column;
      padding: 0 clamp(14px, 4vw, 34px);
    }
    #chat {
      flex: 1 1 0%; min-height: 0; overflow-y: auto; overflow-x: hidden;
      display: flex; flex-direction: column; gap: 22px;
      padding: 34px 2px 28px; scroll-behavior: smooth;
      scrollbar-width: thin; scrollbar-color: rgba(105, 139, 195, .35) transparent;
    }

    .welcome {
      margin: auto auto 20px; width: min(100%, 650px); text-align: center;
      animation: rise .55s ease both;
    }
    .welcome-orb {
      width: 76px; height: 76px; margin: 0 auto 23px; border-radius: 26px;
      display: grid; place-items: center;
      background: radial-gradient(circle at 30% 20%, #9ceaff, #4c8dff 42%, #6047d9 100%);
      box-shadow: 0 15px 55px rgba(63, 128, 255, .35), inset 0 1px 0 rgba(255,255,255,.5);
    }
    .welcome-orb svg { width: 38px; height: 38px; }
    .welcome h1 {
      margin: 0; font-size: clamp(27px, 5vw, 43px); line-height: 1.12;
      letter-spacing: -1.5px; font-weight: 760;
      background: linear-gradient(100deg, #fff 15%, #a8d9ff 55%, #8b9dff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .welcome p { margin: 13px auto 0; max-width: 470px; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .suggestions {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px; margin-top: 28px; text-align: left;
    }
    .suggestion {
      border: 1px solid var(--line); background: rgba(17, 27, 51, .58);
      color: #cbd9f2; border-radius: 15px; padding: 13px 15px;
      cursor: pointer; text-align: left; transition: .2s ease; font-size: 12px; line-height: 1.5;
    }
    .suggestion:hover { border-color: rgba(93, 160, 255, .55); background: rgba(34, 58, 101, .55); transform: translateY(-2px); }
    .suggestion strong { display: block; color: #f0f6ff; font-size: 13px; margin-bottom: 3px; }

    .msg-wrapper { display: flex; flex-direction: column; max-width: 84%; animation: rise .22s ease both; flex-shrink: 0; }
    .user-wrapper { align-self: flex-end; align-items: flex-end; }
    .ai-wrapper { align-self: flex-start; align-items: flex-start; }
    .msg-meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; margin: 0 5px 7px; }
    .avatar {
      width: 22px; height: 22px; display: grid; place-items: center; border-radius: 8px;
      background: linear-gradient(145deg, #5ebcff, #4c66ed); color: white;
    }
    .avatar svg { width: 13px; height: 13px; }
    .msg {
      padding: 13px 16px; border-radius: 18px; line-height: 1.65;
      white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px;
    }
    .user { background: var(--user); color: white; border-bottom-right-radius: 5px; box-shadow: 0 8px 24px rgba(39, 105, 234, .18); }
    .ai { background: rgba(18, 29, 54, .88); border: 1px solid var(--line); color: #e4edff; border-bottom-left-radius: 5px; }
    .typing { display: inline-flex; gap: 5px; align-items: center; min-height: 22px; }
    .typing span { width: 6px; height: 6px; border-radius: 50%; background: #83baff; animation: pulse 1s infinite ease-in-out; }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }

    .composer-area {
      padding: 14px 0 max(18px, env(safe-area-inset-bottom));
      background: linear-gradient(180deg, transparent, rgba(8,13,28,.94) 24%);
      flex-shrink: 0;
    }
    .composer {
      display: flex; align-items: flex-end; gap: 10px;
      padding: 8px 9px 8px 17px; border: 1px solid rgba(133, 164, 218, .22);
      border-radius: 20px; background: rgba(17, 27, 51, .94);
      box-shadow: var(--shadow); transition: .2s ease;
    }
    #prompt {
      flex: 1; min-width: 0; max-height: 160px; resize: none; border: 0; outline: 0;
      color: var(--text); background: transparent; padding: 10px 0;
      font-size: 14px; line-height: 1.5;
    }
    #prompt::placeholder { color: #788bad; }
    .send-btn {
      width: 42px; height: 42px; flex: 0 0 42px; display: grid; place-items: center;
      border: 0; border-radius: 14px; color: white; cursor: pointer;
      background: linear-gradient(145deg, #5bbcff, #3475f2 70%, #5c60e8);
      box-shadow: 0 6px 18px rgba(51, 117, 242, .28); transition: .2s ease;
    }
    .send-btn:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .send-btn:active { transform: scale(.95); }
    .send-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .send-btn svg { width: 19px; height: 19px; }
    .hint { text-align: center; color: #647596; font-size: 10px; margin-top: 10px; }

    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 60%, 100% { opacity: .35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }

    @media (max-width: 640px) {
      .topbar { min-height: 66px; padding: 10px 12px; gap: 8px; }
      .brand { gap: 8px; min-width: auto; }
      .brand-mark { width: 37px; height: 37px; border-radius: 12px; }
      .brand-name { font-size: 14px; }
      .brand-sub { display: none; }
      .connection { gap: 6px; }
      .field { height: 38px; padding: 0 9px; border-radius: 10px; }
      #apiUrl { font-size: 10px; }
      #modelName { width: 88px; font-size: 10px; }
      #installBtn { height: 38px; padding: 0 10px; font-size: 11px; }
      .chat-shell { padding: 0 12px; }
      #chat { padding-top: 22px; gap: 17px; }
      .welcome { margin-bottom: 12px; }
      .welcome-orb { width: 65px; height: 65px; border-radius: 22px; margin-bottom: 19px; }
      .welcome p { font-size: 13px; }
      .suggestions { gap: 8px; margin-top: 22px; }
      .suggestion { padding: 11px; font-size: 11px; }
      .suggestion strong { font-size: 12px; }
      .msg-wrapper { max-width: 92%; }
      .msg { font-size: 13px; padding: 11px 13px; }
      .composer-area { padding-top: 10px; }
      .composer { border-radius: 17px; padding-left: 13px; }
      #prompt { font-size: 13px; }
      .hint { font-size: 9px; }
    }
    @media (max-width: 380px) {
      .brand-name { display: none; }
      #modelName { width: 78px; }
      .suggestions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.8 14.3 9.7 21.2 12l-6.9 2.3L12 21.2l-2.3-6.9L2.8 12l6.9-2.3L12 2.8Z"/>
          <path d="m19 2 .7 2.3L22 5l-2.3.7L19 8l-.7-2.3L16 5l2.3-.7L19 2Z"/>
        </svg>
      </div>
      <div><div class="brand-name">Agnus IA</div><div class="brand-sub">Seu espaço inteligente</div></div>
    </div>
    <div class="connection">
      <button id="installBtn" title="Instalar como Aplicativo">⬇ Instalar App</button>
      <input class="field" type="url" id="apiUrl" placeholder="URL do Cloudflare Tunnel" aria-label="URL do Cloudflare" />
      <input class="field" type="text" id="modelName" value="agnus" title="Modelo Ollama" aria-label="Modelo Ollama" />
    </div>
  </header>

  <main class="main">
    <section class="chat-shell">
      <div id="chat" aria-live="polite">
        <div class="welcome" id="welcome">
          <div class="welcome-orb" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2.8 14.3 9.7 21.2 12l-6.9 2.3L12 21.2l-2.3-6.9L2.8 12l6.9-2.3L12 2.8Z"/>
              <path d="m19 2 .7 2.3L22 5l-2.3.7L19 2Z"/>
            </svg>
          </div>
          <h1>Olá! Como posso ajudar?</h1>
          <p>Seu espaço para ideias, perguntas e descobertas. Converse com sua IA conectada às GPUs do Kaggle.</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="Explique um assunto complexo de um jeito simples."><strong>✦ Aprender algo</strong>Explique um assunto de forma simples</button>
            <button class="suggestion" data-prompt="Me ajude a criar um projeto do zero, com etapas práticas."><strong>⌘ Criar um projeto</strong>Transforme uma ideia em um plano</button>
            <button class="suggestion" data-prompt="Revise este código e sugira melhorias."><strong>{ } Programar</strong>Revise ou explique um código</button>
            <button class="suggestion" data-prompt="Me dê ideias criativas para resolver um problema."><strong>✧ Ter ideias</strong>Explore novas possibilidades</button>
          </div>
        </div>
      </div>

      <div class="composer-area">
        <div class="composer">
          <textarea id="prompt" rows="1" placeholder="Pergunte alguma coisa..." autocomplete="off" aria-label="Digite sua mensagem"></textarea>
          <button class="send-btn" id="sendBtn" aria-label="Enviar mensagem" title="Enviar mensagem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M5 12l7-7 7 7"/>
            </svg>
          </button>
        </div>
        <div class="hint">Agnus IA pode cometer erros. Confira informações importantes.</div>
      </div>
    </section>
  </main>

  <script>
    // ==========================================
    // CONFIGURAÇÃO PWA (Manifest & Service Worker)
    // ==========================================
    const pwaIcon = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2365b8ff'/%3E%3Cstop offset='65%25' stop-color='%233868ed'/%3E%3Cstop offset='100%25' stop-color='%23704dff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='120' fill='url(%23g)'/%3E%3Cpath d='M256 96l44 132 132 44-132 44-44 132-44-132-132-44 132-44z' fill='none' stroke='white' stroke-width='28' stroke-linejoin='round'/%3E%3C/svg%3E";

    const manifestObj = {
      name: "Agnus IA",
      short_name: "Agnus",
      description: "Assistente de Inteligência Artificial Agnus",
      start_url: window.location.href,
      display: "standalone",
      background_color: "#080d1c",
      theme_color: "#080d1c",
      icons: [
        { src: pwaIcon, sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" },
        { src: pwaIcon, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
      ]
    };

    const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
    document.getElementById('pwa-manifest').setAttribute('href', URL.createObjectURL(manifestBlob));

    // Registra Service Worker mínimo para habilitar instalação PWA
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
      const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', (e) => {});
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
    }

    // Captura evento de instalação do navegador
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-block';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') installBtn.style.display = 'none';
      deferredPrompt = null;
    });

    // ==========================================
    // LÓGICA DO CHAT AGNUS
    // ==========================================
    const chat = document.getElementById('chat');
    const historico = [
      { 
        role: 'system', 
        content: 'Você se chama Agnus. Você é um assistente de inteligência artificial útil, direto e eficiente, rodando em um ambiente em nuvem. Sempre responda em português do Brasil.' 
      }
    ];
    const input = document.getElementById('prompt');
    const btn = document.getElementById('sendBtn');

    // Salva e recupera automaticamente a URL do túnel no navegador
    const apiUrlInput = document.getElementById('apiUrl');
    apiUrlInput.value = localStorage.getItem('agnus_api_url') || '';
    apiUrlInput.addEventListener('input', () => localStorage.setItem('agnus_api_url', apiUrlInput.value.trim()));

    const assistantIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 14.3 9.7 21.2 12l-6.9 2.3L12 21.2l-2.3-6.9L2.8 12l6.9-2.3L12 2.8Z"/></svg>`;

    function addMsg(texto, classe, typing = false) {
      document.getElementById('welcome')?.remove();
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper ${classe === 'user' ? 'user-wrapper' : 'ai-wrapper'}`;

      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      if (classe === 'ai') {
        const avatar = document.createElement('span');
        avatar.className = 'avatar';
        avatar.innerHTML = assistantIcon;
        meta.append(avatar, document.createTextNode('Agnus IA'));
      } else {
        meta.textContent = 'Você';
      }

      const div = document.createElement('div');
      div.className = 'msg ' + classe;
      if (typing) {
        div.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
      } else {
        div.textContent = texto;
      }
      wrapper.append(meta, div);
      chat.appendChild(wrapper);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function enviar() {
      const urlBase = apiUrlInput.value.trim().replace(/\/+$/, '');
      const modelo = document.getElementById('modelName').value.trim();
      const texto = input.value.trim();

      if (!urlBase) {
        alert('Cole a URL do Cloudflare Tunnel no topo primeiro!');
        apiUrlInput.focus();
        return;
      }
      if (!texto || btn.disabled) return;

      addMsg(texto, 'user');
      historico.push({ role: 'user', content: texto });
      input.value = '';
      input.style.height = 'auto';
      btn.disabled = true;

      const aiDiv = addMsg('', 'ai', true);
      let respostaCompleta = '';

      try {
        const res = await fetch(`${urlBase}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: modelo, messages: historico, stream: true })
        });

        if (!res.ok) {
          const detalhe = await res.text().catch(() => '');
          throw new Error(detalhe || `Erro HTTP ${res.status}`);
        }
        if (!res.body) throw new Error('O servidor não retornou um fluxo de resposta.');

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const linhas = buffer.split('\n');
          buffer = linhas.pop() || '';

          for (const linha of linhas) {
            const limpa = linha.trim();
            if (!limpa) continue;
            try {
              const json = JSON.parse(limpa);
              if (json.message?.content) {
                respostaCompleta += json.message.content;
                aiDiv.textContent = respostaCompleta;
                chat.scrollTop = chat.scrollHeight;
              }
              if (json.error) throw new Error(json.error);
            } catch (e) {
              if (e instanceof SyntaxError) continue;
              throw e;
            }
          }
        }

        buffer += decoder.decode();
        if (buffer.trim()) {
          try {
            const json = JSON.parse(buffer.trim());
            if (json.message?.content) respostaCompleta += json.message.content;
          } catch (_) {}
        }

        aiDiv.textContent = respostaCompleta || 'A IA não retornou texto. Verifique o modelo e o servidor.';
        historico.push({ role: 'assistant', content: respostaCompleta });
      } catch (err) {
        aiDiv.textContent = `Não consegui conectar ao servidor.\n\n${err.message}\n\nConfira a URL do Cloudflare e se o notebook do Kaggle continua em execução.`;
      } finally {
        btn.disabled = false;
        input.focus();
        chat.scrollTop = chat.scrollHeight;
      }
    }

    btn.addEventListener('click', enviar);
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        enviar();
      }
    });
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    });
    document.querySelectorAll('.suggestion').forEach((item) => {
      item.addEventListener('click', () => {
        input.value = item.dataset.prompt;
        input.dispatchEvent(new Event('input'));
        input.focus();
      });
    });
  </script>
</body>
</html>
